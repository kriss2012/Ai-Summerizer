<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .main-card {
            background-color: #1f2937;
        }
        .loader {
            border-top-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen p-4">

    <div class="main-card w-full max-w-4xl p-8 rounded-xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white">AI Text Summarizer</h1>
            <p class="text-gray-400 mt-2">Paste your long text below to get a concise summary.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Input Area -->
            <div>
                <label for="text-input" class="text-lg font-semibold mb-2 block">Your Text</label>
                <textarea id="text-input" class="w-full h-80 p-4 rounded-lg bg-gray-800 border border-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none" placeholder="Paste your article, report, or any long text here..."></textarea>
            </div>

            <!-- Output Area -->
            <div>
                <label for="summary-output" class="text-lg font-semibold mb-2 block">Generated Summary</label>
                <div id="summary-container" class="w-full h-80 p-4 rounded-lg bg-gray-800 border border-gray-700 relative">
                    <div id="summary-placeholder" class="text-gray-500">
                        Your summary will appear here...
                    </div>
                    <div id="summary-output" class="h-full overflow-y-auto"></div>
                    <div id="loader" class="absolute inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center rounded-lg hidden">
                        <div class="loader w-12 h-12 rounded-full border-4 border-gray-500"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-8">
            <button id="summarize-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full text-lg transition-transform transform hover:scale-105">
                Summarize Text
            </button>
        </div>
        
        <div id="error-message" class="text-center text-red-400 mt-4 hidden"></div>
    </div>

    <script>
        const summarizeBtn = document.getElementById('summarize-btn');
        const textInput = document.getElementById('text-input');
        const summaryOutput = document.getElementById('summary-output');
        const summaryPlaceholder = document.getElementById('summary-placeholder');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        
        // The URL where your Flask backend is running
        const backendUrl = "http://127.0.0.1:5000/summarize";

        summarizeBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            
            if (!text) {
                showError("Please paste some text to summarize.");
                return;
            }
            
            // Show loader and hide previous results
            loader.classList.remove('hidden');
            summaryOutput.textContent = '';
            summaryPlaceholder.classList.add('hidden');
            hideError();

            try {
                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                summaryOutput.textContent = data.summary;

            } catch (error) {
                console.error("Error:", error);
                showError("Could not connect to the summarizer service. Please ensure the backend is running.");
                summaryPlaceholder.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
